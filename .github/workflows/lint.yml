name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to a commit, not a tag: a tag can be moved to other code.
# The comment names the release; update both together.

jobs:
  php:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; the token need not stay in .git/config.
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, openssl, pdo_mysql, fileinfo, mbstring, curl
          coverage: none

      - name: Run project checks
        run: |
          chmod +x bin/lint.sh
          ./bin/lint.sh

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; the token need not stay in .git/config.
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: sodium, openssl, pdo_mysql, fileinfo, mbstring, curl
          # Pinned to a release that passes; bin/lint.sh uses the latest one
          # locally and offers to raise this line when it passes too.
          tools: phpstan:2.3.4
          coverage: none

      # Level and paths come from bin/tools/phpstan.neon, shared with bin/lint.sh.
      - name: Analyse
        run: phpstan analyse -c bin/tools/phpstan.neon --no-progress

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; the token need not stay in .git/config.
          persist-credentials: false

      # Rules in bin/tools/stylelint.json, shared with bin/lint.sh. Pinned to a
      # release that passes; bin/lint.sh uses the latest one locally and
      # offers to raise the version below when it passes too. The runner's Node.
      - name: Install
        run: npm install --prefix bin/tools/stylelint --no-save --no-audit --no-fund stylelint@17.16.0

      - name: Check
        run: >-
          bin/tools/stylelint/node_modules/.bin/stylelint
          --config bin/tools/stylelint.json --quiet-deprecation-warnings
          "public/assets/css/*.css"
