name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here — see [SECURITY.md](https://github.com/SalvatoreNoschese/AESBin/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in
        2. Upload a file
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AESBin version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.3.6"
    validations:
      required: true
  - type: input
    id: db
    attributes:
      label: MySQL / MariaDB version
      placeholder: "MariaDB 10.11"
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: Web server
      options: [Apache, nginx, Caddy, Other]
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: Hosting
      options: [Shared hosting, VPS / dedicated, Local development, Other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: PHP error log or browser console. Redact hostnames, tokens and share URLs.
      render: text
